[package]
name = "call-assistant"
version = "0.1.0"
description = "Local-first call assistant"
authors = ["Grey"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Single instance: two copies would each spawn a backend and fight over the
# SQLite database and the audio device.
tauri-plugin-single-instance = "2"
# Opens the log folder in Explorer for the startup-failure screen.
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rand = "0.8"
# Tiny blocking HTTP client, used once for POST /shutdown. Deliberately not
# reqwest: pulling in a full async stack for a single fire-and-forget request
# would add minutes to the build and megabytes to the binary.
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
