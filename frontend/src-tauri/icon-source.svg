<!-- Interview Coach app icon.

     The ensō (円相) is the Zen brush circle: drawn in one uninterrupted motion and left open
     rather than closed. That is what practice is — one continuous movement, deliberately
     unfinished — so the gesture is kept from the original drawing.

     What changed, and why:

     - The barbell is gone. It was doing semantic work for a gym app; here it only added a
       second shape that merged into a single pink dash at 32px, which is the size this icon
       spends most of its life at.
     - One mark inside the ring, in the app's own accent blue, following the kamon (家紋) crest
       rule: one enclosing ring, one mark, nothing else. It survives the shrink where the
       barbell collars did not.
     - The plate is rounded rather than square. Full-bleed black reads as a black tile among
       transparent neighbours on a light taskbar; rounding it makes it read as an icon.
       It is NOT transparent on purpose — a bone-white stroke on a light theme would disappear,
       and the plate is what guarantees contrast in both themes.

     The circle is a filled outline, not a stroke, so the brush tapers: thin where the stroke
     starts, swelling through the sweep, thinning into the tail. A uniform ring reads as a washer.
     Path is baked, not generated. -->
