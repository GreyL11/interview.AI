[pytest]
# Registered so the OCR suite's marker is not a silent typo. `slow` marks the
# handful of tests that run real image recognition (a second or two each);
# everything else in that suite stubs the engine and runs instantly.
#
#   run everything (default)     pytest
#   skip the slow ones           pytest -m "not slow"
markers =
    slow: runs real OCR recognition rather than a stubbed engine
